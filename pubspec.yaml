name: divine_arc
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+7

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter

  # Cupertino and Material Icons
  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^4.1.1
  firebase_auth: ^6.1.0
  firebase_messaging: ^16.0.2
  flutter_local_notifications: ^19.5.0

  # Authentication
  google_sign_in: ^6.3.0
  sign_in_with_apple: ^7.0.1
  flutter_facebook_auth: ^7.1.2

  # State management & UI
  flutter_bloc: ^9.1.1
  fluttertoast: ^9.0.0
  loading_animation_widget: ^1.2.0
  flutter_localization: 0.3.3

  # Utilities
  connectivity_plus: ^7.0.0
  permission_handler: 12.0.1
  shared_preferences: ^2.5.3
  url_launcher: 6.3.2
  flutter_svg: 2.2.1
  image_picker: 1.2.0
  record: 6.1.1
  just_audio: 0.10.5
  http: 1.5.0
  path_provider: ^2.1.5
  flutter_sound: 9.28.0
  audioplayers: 6.5.1
  share_plus: 12.0.0
  flutter_markdown: ^0.7.7+1
  bloc: ^9.2.0
  provider: ^6.1.5+1
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/
    - assets/images/
    - assets/audio/
    - lib/l10n/
    - shorebird.yaml

  fonts:
    - family: Warnes-Regular
      fonts:
        - asset: assets/fonts/Warnes/Warnes-Regular.ttf

    - family: DM_Sans
      fonts:
        - asset: assets/fonts/DM_Sans/DMSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/DM_Sans/DMSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/DM_Sans/DMSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/DM_Sans/DMSans-ExtraBold.ttf
          weight: 800
